name = "courriel"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Garde la trace de chaque lettre : Workers & Pages → courriel → Logs.
[observability]
enabled = true

# Rien de secret ici : ce fichier part sur GitHub.
# La boîte de destination (BOITE) et la clef Resend (RESEND_API_KEY) se posent
# dans le tableau de bord Cloudflare : Workers & Pages → courriel → Settings →
# Variables and Secrets.

# Facultatif — la mémoire qui évite de répondre deux fois le même jour à la
# même personne. Créez un espace KV nommé « souvenirs », copiez son
# identifiant ici, et retirez les dièses des deux lignes.
# [[kv_namespaces]]
# binding = "MEMOIRE"
# id = "<identifiant de l'espace KV>"
